{{- if and .Values.ingress.enabled (eq (include "web-app.ingressType" .) "route") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "web-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  host: {{ include "web-app.ingressHost" . | quote }}
  to:
    kind: Service
    name: {{ include "web-app.fullname" . }}
    weight: 100
  port:
    targetPort: http
  wildcardPolicy: None
  {{- if .Values.ingress.tls.enabled }}
  {{- /* Edge termination; insecureEdgeTerminationPolicy is left unset (None): plain HTTP is neither served nor redirected. */}}
  tls:
    termination: edge
    certificate: {{ include "web-app.tlsCertificate" . | toJson }}
    key: {{ include "web-app.tlsKey" . | toJson }}
  {{- end }}
{{- end }}
