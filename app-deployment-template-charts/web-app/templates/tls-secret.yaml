{{- /* type=route inlines the PEMs into the Route instead (no router RBAC on the Secret needed). */}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (ne (include "web-app.ingressType" .) "route") }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ include "web-app.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
data:
  tls.crt: {{ include "web-app.tlsCertificate" . | b64enc }}
  tls.key: {{ include "web-app.tlsKey" . | b64enc }}
{{- end }}
