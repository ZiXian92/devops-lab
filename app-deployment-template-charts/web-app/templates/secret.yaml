{{- if .Values.secret.data }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "web-app.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web-app.labels" . | nindent 4 }}
# Values are already base64 (see values.yaml for the yq recipe).
data:
  {{- toYaml .Values.secret.data | nindent 2 }}
{{- end }}
