version: "3.8"

services:
  nexus:
    image: sonatype/nexus3:3.96.0
    container_name: nexus
    networks:
      - kind
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms1200m -Xmx1200m -XX:MaxDirectMemorySize=2g -Djava.util.prefs.userRoot=/nexus-data/javaprefs
    mem_limit: 3g
    restart: unless-stopped

  # Helm CI/CD toolbox (helm, helm-unittest, kubeconform + the `tasks` script). It idles;
  # work is done by exec-ing into it:
  #   podman compose exec helm-cicd tasks all
  #   podman compose exec helm-cicd tasks publish web-app
  # Rebuild after changing images/helm-cicd:  podman compose up -d --build helm-cicd
  helm-cicd:
    build:
      context: ./images/helm-cicd
    image: devops-lab/helm-cicd:local
    container_name: helm-cicd
    command: ["sleep", "infinity"]
    init: true
    networks:
      - kind
    depends_on:
      - nexus
    volumes:
      # Charts are read-only: the container packages into /tmp/dist, never into the repo.
      - ./app-deployment-template-charts:/workspace/app-deployment-template-charts:ro
      # helm-publisher credentials written by nexus-tf (created empty by Start-Services.ps1).
      - ./nexus-tf/helm-registry:/run/nexus-credentials:ro
    environment:
      - HELM_OCI_REPO=oci://nexus:8081/oci-internal/helm/deployment-templates
      - HELM_PLAIN_HTTP=true
    # Hardening: nothing here needs root, extra privileges or a writable image.
    read_only: true
    tmpfs:
      - /tmp
      # helm's cache/config. podman rejects uid=/gid= here, so the mount is sticky and
      # world-writable like /tmp; the container only has the one user anyway.
      - /home/helm:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped

  # Jenkins controller: latest LTS on JDK 25, configured by JCasC (jenkins/casc/jenkins.yaml).
  # UI: http://localhost:8080 (user admin, password in jenkins/secrets/admin-password).
  # Rebuild after changing images/jenkins-controller:  podman compose up -d --build jenkins
  # Apply a changed jenkins/casc/jenkins.yaml:          podman compose restart jenkins
  jenkins:
    build:
      context: ./images/jenkins-controller
    image: devops-lab/jenkins-controller:local
    container_name: jenkins
    init: true
    networks:
      - kind
    ports:
      - "8080:8080"
    depends_on:
      - vault
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./jenkins/casc:/casc:ro
      # admin / agent-connector passwords, generated by Start-Services.ps1.
      - ./jenkins/secrets:/run/jenkins-secrets:ro
      # Vault AppRole role-id/secret-id for the "vault-approle" credential (scoped to the
      # "vault-demo" folder only, see the jobs: script in jenkins.yaml), written by vault-tf
      # (created empty by Start-Services.ps1). Restart jenkins after vault-tf applies for
      # real: podman compose restart jenkins
      - ./vault-tf/jenkins-credentials:/run/vault-credentials:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    restart: unless-stopped

  # Jenkins inbound agent (node "agent" in the JCasC file): JDK 25 + kubectl, helm and
  # podman (`docker` is a symlink to it). Rebuild after changing images/jenkins-agent:
  #   podman compose up -d --build jenkins-agent
  jenkins-agent:
    build:
      context: ./images/jenkins-agent
    image: devops-lab/jenkins-agent:local
    container_name: jenkins-agent
    init: true
    networks:
      - kind
    depends_on:
      - jenkins
    # podman here is a client for the podman machine's API. Mounting its socket gives
    # pipelines control of the machine's containers (root-equivalent in the lab VM): fine for
    # a local lab, not for anything shared. keep-id maps the machine user to uid 1000 in
    # the container, which is the agent's `jenkins` user, so the 0660 socket is usable.
    # Override the socket path if the machine differs (podman info: RemoteSocket.Path).
    userns_mode: keep-id
    volumes:
      - ${PODMAN_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
      - ./jenkins/secrets:/run/jenkins-secrets:ro
      - jenkins-agent-work:/home/jenkins/agent
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_AGENT_NAME=agent
      - JENKINS_WEB_SOCKET=true
      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # The podman socket is owned by another user's SELinux context on some machines.
      - label=disable
    mem_limit: 2g
    restart: unless-stopped

  # Vault: single-node, non-dev server, file-storage backed (vault/config/vault.hcl). Plain
  # HTTP, matching Nexus's lab setup. UI/API: http://localhost:8200. Data persists in the
  # vault-data volume, but Vault still seals on every restart -- Start-Services.ps1 unseals
  # it after startup using the key saved (on first init) to vault/secrets/init.json
  # (gitignored). Root token from that file is used by vault-tf.
  vault:
    image: docker.io/hashicorp/vault:2.1.1
    container_name: vault
    networks:
      - kind
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./vault/config:/vault/config:ro
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      # No IPC_LOCK capability is granted (cap_drop: ALL); skip the entrypoint's setcap
      # attempt, which would just fail against the read-only rootfs. disable_mlock in
      # vault.hcl means mlock is never needed anyway.
      - SKIP_SETCAP=true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped

networks:
  kind:
    external: true
    name: kind-devops-lab

volumes:
  nexus-data:
  jenkins-home:
  jenkins-agent-work:
  vault-data:
